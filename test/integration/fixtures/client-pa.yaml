# Baseline smoke test fixture — paqet defaults (local_flag/remote_flag: ["PA"]).
# This file is a Go text/template; the integration harness materialises it
# into a tempdir after substituting the placeholders below.
#
# Placeholders:
#   {{.TunnelPort}}   — tunnel (server listen) TCP port
#   {{.SocksPort}}    — SOCKS5 listener port on the client side
#   {{.Iface}}        — pcap interface (defaults to lo0; CTUN_TEST_IFACE overrides)
#   {{.RouterMAC}}    — placeholder MAC (see server fixture)
#   {{.SharedKey}}    — symmetric key shared between client and server
role: "client"

log:
  level: "warn"

socks5:
  - listen: "127.0.0.1:{{.SocksPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    addr: "127.0.0.1:0"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["PA"]
    remote_flag: ["PA"]

server:
  addr: "127.0.0.1:{{.TunnelPort}}"

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
