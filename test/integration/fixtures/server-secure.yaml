# T3.5 secure-tunnel fixture (server) — explicit `transport_impl: "syn-tfo"`
# AND `cipher: chacha20poly1305`.
#
# Derived from server-syntfo.yaml (the Phase-1 baseline fixture T1.5 uses).
# The only material differences are:
#
#   - top-level `cipher: "chacha20poly1305"` — selects the AEAD wrapper that
#     T2.2 added to the config schema, T3.4 wired into the data path, and
#     T3.5 now exercises end-to-end.
#
# Placeholders are identical to server-syntfo.yaml — see that file for the
# variable definitions.
role: "server"

log:
  # Info so the "Server started - listening for packets on :PORT" readiness
  # line is emitted; the integration tests grep the subprocess log for that
  # prefix instead of a TCP dial (the SYN-TFO server has no kernel listener).
  level: "info"

transport_impl: "syn-tfo"
cipher: "chacha20poly1305"

listen:
  addr: "127.0.0.1:{{.TunnelPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    addr: "127.0.0.1:{{.TunnelPort}}"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["S"]

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
