# T3.5 secure-tunnel fixture (client) — explicit `transport_impl: "syn-tfo"`
# AND `cipher: chacha20poly1305`.
#
# Derived from client-syntfo.yaml (the Phase-1 baseline fixture T1.5 uses).
# The only material differences are:
#
#   - top-level `cipher: "chacha20poly1305"` — selects the AEAD wrapper that
#     T2.2 added to the config schema, T3.4 wired into the data path, and
#     T3.5 now exercises end-to-end.
#
# Placeholders are identical to client-syntfo.yaml — see that file for the
# variable definitions.
role: "client"

log:
  # T4.9: same readiness reason as client-syntfo.yaml — keep client logs
  # at "info" so integration-test diagnostics capture startup and
  # handshake-complete lines, not just warnings.
  level: "info"

transport_impl: "syn-tfo"
cipher: "chacha20poly1305"

socks5:
  - listen: "127.0.0.1:{{.SocksPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    # T4.9: same reason as client-syntfo.yaml — pin a real client
    # port so the pcap BPF filter accepts inbound HELLO_ACK / KCP
    # traffic from the server.
    addr: "127.0.0.1:{{.ClientPort}}"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["S"]
    remote_flag: ["S"]

server:
  addr: "127.0.0.1:{{.TunnelPort}}"

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
