# Baseline smoke test fixture — paqet defaults (local_flag: ["PA"]).
# This file is a Go text/template; the integration harness materialises it
# into a tempdir after substituting the placeholders below.
#
# Placeholders:
#   {{.TunnelPort}}  — tunnel (server listen) TCP port
#   {{.Iface}}       — pcap interface (defaults to lo0; CTUN_TEST_IFACE overrides)
#   {{.RouterMAC}}   — placeholder MAC; loopback has no gateway but the
#                      config validator requires the field
#   {{.SharedKey}}   — symmetric key shared between client and server
role: "server"

log:
  level: "warn"

listen:
  addr: "127.0.0.1:{{.TunnelPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    addr: "127.0.0.1:{{.TunnelPort}}"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["PA"]

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
