# SYN-only feasibility fixture — both local_flag and remote_flag set to ["S"].
# Mirrors client-pa.yaml but with the flag profile narrowed to a bare SYN so
# we can probe whether paqet's flag-cycling code path is fully wired for the
# SYN-only mode that Phase 1 builds on. T0.3 owns this file; T1.5 replaces it
# with a SYN-TFO variant and T4.6 deletes it.
#
# Placeholders: see client-pa.yaml.
role: "client"

log:
  level: "warn"

socks5:
  - listen: "127.0.0.1:{{.SocksPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    addr: "127.0.0.1:0"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["S"]
    remote_flag: ["S"]

server:
  addr: "127.0.0.1:{{.TunnelPort}}"

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
