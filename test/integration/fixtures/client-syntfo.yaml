# Phase-1 SYN-TFO fixture (client) — explicit `transport_impl: "syn-tfo"`.
#
# Derived from client-s.yaml (the SYN-only feasibility fixture T0.3 used). The
# only material difference is the explicit `transport_impl` selector: the
# config defaulter (internal/conf/conf.go) already resolves an empty value to
# "syn-tfo", but T1.5's smoke test is the first integration check that the
# Phase-1 transport — with the TFO option on every SYN and the receive-side
# Kind=34 gate — is what's actually carrying traffic. Pinning the selector in
# the YAML makes that intent obvious to anyone skimming the fixture and locks
# the test against a future default flip.
#
# Placeholders: see client-pa.yaml.
role: "client"

log:
  # T4.9: bumped from "warn" to "info" so the client emits its startup +
  # handshake-complete lines into the subprocess log buffer. The
  # integration tests poll the buffer for failure diagnostics; running at
  # "warn" hid every interesting line in the handshake-driven boot path.
  level: "info"

transport_impl: "syn-tfo"

socks5:
  - listen: "127.0.0.1:{{.SocksPort}}"

network:
  interface: "{{.Iface}}"
  ipv4:
    # T4.9: pin a real, non-zero client port. The BPF recv filter is
    # `tcp and dst port <Port>`; the pre-T4.9 fixture used :0 which
    # made the filter `dst port 0` and silently dropped the
    # server-side HELLO_ACK. ClientPort is allocated per-test from a
    # free loopback port.
    addr: "127.0.0.1:{{.ClientPort}}"
    router_mac: "{{.RouterMAC}}"
  tcp:
    local_flag: ["S"]
    remote_flag: ["S"]

server:
  addr: "127.0.0.1:{{.TunnelPort}}"

transport:
  protocol: "kcp"
  conn: 1
  kcp:
    mode: "fast"
    key: "{{.SharedKey}}"
